---
services:
  db:
    image: ruthikrampalli/pyapp:db_image
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_db_password
    secrets:
      - mysql_db_password

  auth_service:
    image: ruthikrampalli/pyapp:auth_image
    deploy:
      replicas: 2
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

  book_service:
    image: ruthikrampalli/pyapp:book_image
    deploy:
      replicas: 2
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: ruthikrampalli/pyapp:borrow_image
    deploy:
      replicas: 2
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: ruthikrampalli/pyapp:frontend
    deploy:
      replicas: 2
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
secrets:
   mysql_db_password:
       external: true
